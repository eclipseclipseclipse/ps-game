<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Game Sandbox Multiplayer</title>
  <style>
    :root {
      --bg-color: #0d1b1e;
      --felt-color: #123826;
      --felt-pattern: radial-gradient(#1e583c 15%, transparent 16%), radial-gradient(#1e583c 15%, transparent 16%);
      --card-width: 68px;
      --card-height: 100px;
      --accent-color: #2ec4b6;
      --panel-bg: rgba(18, 30, 38, 0.92);
      --text-color: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Top Control Bar */
    header {
      height: 52px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button, .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover, .btn-action:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--accent-color);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      background: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
    }

    button.primary:hover {
      background: #3ee0d0;
      box-shadow: 0 0 12px rgba(46, 196, 182, 0.4);
    }

    button.danger {
      background: rgba(231, 76, 60, 0.2);
      border-color: rgba(231, 76, 60, 0.4);
      color: #ff6b6b;
    }

    button.danger:hover {
      background: rgba(231, 76, 60, 0.4);
    }

    select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    /* Tabletop Canvas Area */
    #table-viewport {
      flex: 1;
      position: relative;
      overflow: auto;
      background-color: var(--felt-color);
      background-image: var(--felt-pattern);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      cursor: default;
    }

    #table-canvas {
      width: 3000px;
      height: 2000px;
      position: relative;
    }

    /* Main Deck Zone */
    #deck-zone {
      position: absolute;
      top: 60px;
      left: 60px;
      width: var(--card-width);
      height: var(--card-height);
      border: 2px dashed rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
    }

    #deck-zone:hover {
      border-color: var(--accent-color);
      background: rgba(46, 196, 182, 0.05);
    }

    #deck-zone .deck-label {
      font-size: 0.7rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
    }

    #deck-zone .deck-count {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }

    /* Cards Styling */
    .card {
      width: var(--card-width);
      height: var(--card-height);
      position: absolute;
      border-radius: 7px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.2);
      cursor: grab;
      touch-action: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px;
      font-family: 'Arial Black', Gadget, sans-serif;
      overflow: hidden;
    }

    .card:active {
      cursor: grabbing;
    }

    .card.dragging {
      z-index: 9999 !important;
      box-shadow: 0 12px 25px rgba(0,0,0,0.5), 0 0 15px var(--accent-color);
      opacity: 0.95;
    }

    .card.selected {
      outline: 2px solid #38ef7d;
      box-shadow: 0 0 12px #38ef7d;
    }

    /* Card Back */
    .card.face-down {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;
      border: 2px solid #334155;
    }

    .card.face-down * {
      display: none !important;
    }

    .card.face-down::after {
      content: '✦';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      color: rgba(255, 255, 255, 0.15);
      display: block !important;
    }

    /* Color Suits */
    .card.color-red { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: #fff; }
    .card.color-yellow { background: linear-gradient(135deg, #f7b731, #f5cd79); color: #000; }
    .card.color-green { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; }
    .card.color-blue { background: linear-gradient(135deg, #1e3c72, #2a5298); color: #fff; }
    .card.color-black { background: linear-gradient(135deg, #232526, #414345); color: #fff; border: 1px solid #555; }

    /* Card Layout Inner */
    .card-top {
      font-size: 0.75rem;
      line-height: 1;
      align-self: flex-start;
      font-weight: 900;
    }

    .card-center {
      align-self: center;
      font-size: 1.2rem;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      text-align: center;
      word-break: break-word;
    }

    .card-bottom {
      font-size: 0.75rem;
      line-height: 1;
      align-self: flex-end;
      transform: rotate(180deg);
      font-weight: 900;
    }

    .card.color-yellow .card-center, 
    .card.color-yellow .card-top, 
    .card.color-yellow .card-bottom {
      text-shadow: none;
    }

    /* Card Types Special/Wild */
    .type-special .card-center {
      font-size: 0.65rem;
      letter-spacing: 0.5px;
      background: rgba(0,0,0,0.25);
      padding: 2px 4px;
      border-radius: 4px;
    }

    .type-wild .card-center {
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      background: linear-gradient(45deg, #ff4b2b, #f7b731, #38ef7d, #2a5298);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }

    /* Player Hand Drawer */
    #hand-drawer {
      height: 130px;
      background: var(--panel-bg);
      border-top: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1000;
      transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #hand-drawer.collapsed {
      height: 32px;
    }

    .hand-header {
      height: 32px;
      background: rgba(0,0,0,0.3);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .hand-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #hand-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: -15px;
      padding: 0 20px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    #hand-container .card {
      position: relative !important;
      top: 0 !important;
      left: 0 !important;
      transform: none !important;
      flex-shrink: 0;
      margin-right: -25px;
      transition: margin 0.2s, transform 0.2s;
    }

    #hand-container .card:hover {
      transform: translateY(-15px) scale(1.08) !important;
      margin-right: 5px;
      z-index: 100;
    }

    /* Selection Box */
    #selection-box {
      position: absolute;
      border: 1px dashed var(--accent-color);
      background: rgba(46, 196, 182, 0.15);
      pointer-events: none;
      display: none;
      z-index: 8000;
    }

    /* Context Menu */
    #context-menu {
      position: fixed;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 10000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    #context-menu button {
      justify-content: flex-start;
      background: transparent;
      border: none;
      width: 100%;
      padding: 8px 12px;
      border-radius: 4px;
    }

    #context-menu button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Lobby Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20000;
    }

    .modal-card {
      background: #121e26;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 28px;
      width: 360px;
      max-width: 90vw;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }

    .modal-card h2 {
      margin-bottom: 8px;
      color: var(--accent-color);
    }

    .modal-card p {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: rgba(255,255,255,0.7);
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      text-align: center;
      letter-spacing: 2px;
    }

    .input-group input:focus {
      border-color: var(--accent-color);
    }

    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-buttons button {
      width: 100%;
      padding: 10px;
      justify-content: center;
      font-size: 0.95rem;
    }

    /* Player Cursors */
    .player-cursor {
      position: absolute;
      width: 16px;
      height: 16px;
      pointer-events: none;
      z-index: 9000;
      transition: left 0.1s linear, top 0.1s linear;
    }

    .player-cursor::after {
      content: attr(data-name);
      position: absolute;
      top: 16px;
      left: 10px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      white-space: nowrap;
    }

    /* Room Badge */
    .room-badge {
      background: rgba(46, 196, 182, 0.15);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #38ef7d;
      border-radius: 50%;
      display: inline-block;
    }

    /* Mode Switcher Banner */
    .network-banner {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>

  <div id="app-container">

    <header>

        <select id="select-theme">
          <option value="felt">Green Felt</option>

    <!-- Tabletop Workspace -->

        <!-- Dynamic Selection Box -->
        <div id="selection-box"></div>

    <!-- Private Player Hand -->
    <div id="hand-drawer">

          <span>🖐️ Private Hand</span>
          <span id="hand-count">(0 cards)</span>
        </div>
        <span id="hand-chevron">▼</span>
      </div>

        <!-- Private Hand Cards Rendered Here -->
      </div>

  <!-- Context Menu -->
  <div id="context-menu">
    <button id="menu-flip">🔄 Flip Card (F)</button>
    <button id="menu-rotate">↻ Rotate 90° (R)</button>
    <button id="menu-to-hand">📥 Take to Hand</button>
    <button id="menu-to-deck">🔝 Return to Deck Top</button>
  </div>

  <!-- Room Lobby Modal -->
  <div class="modal-overlay" id="lobby-modal">
    <div class="modal-card">
      <h2>Card Game Sandbox</h2>
      <p>Play locally or join a room with up to 4 players!</p>

      <div class="input-group">
        <label>Your Display Name</label>
        <input type="text" id="player-name-input" maxlength="12" value="Player 1">
      </div>

      <div class="input-group">
        <label>Room Code (To Join)</label>
        <input type="text" id="room-code-input" maxlength="6" placeholder="e.g. 849201" style="text-transform: uppercase;">
      </div>

      <div class="modal-buttons">
        <button class="primary" id="btn-create-room">🚀 Create New Room</button>
        <button id="btn-join-room">🔗 Join Existing Room</button>
        <button id="btn-offline-mode" style="background: rgba(255,255,255,0.05); color: #aaa;">🎮 Offline / Local Sandbox</button>
      </div>

      <div class="network-banner">
        Runs seamlessly in all browsers & offline environments.
      </div>
    </div>
  </div>

  <!-- Sound Synthesizer (Web Audio API) -->
  <script>
    class SoundEffects {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      playCardSlide() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      playCardFlip() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.06);
      }
    }

    const sfx = new SoundEffects();
  </script>

  <!-- Main Game Logic -->
  <script>
    // Application State
    const state = {
      roomId: null,
      playerId: 'p_' + Math.random().toString(36).substring(2, 9),
      playerName: 'Player 1',
      isOffline: true,
      deck: [],
      tableCards: {}, // cardId -> cardObj
      handCards: [],  // array of cardObj
      selectedCardIds: new Set(),
      highestZIndex: 100,
      activeContextMenuCardId: null
    };

    const CARD_COLORS = ['red', 'yellow', 'green', 'blue'];
    const PLAYER_COLORS = ['#ff4b2b', '#2e10c4', '#38ef7d', '#f7b731'];

    // DOM Elements
    const elements = {
      tableViewport: document.getElementById('table-viewport'),
      tableCanvas: document.getElementById('table-canvas'),
      deckZone: document.getElementById('deck-zone'),
      deckCount: document.getElementById('deck-count'),
      handContainer: document.getElementById('hand-container'),
      handDrawer: document.getElementById('hand-drawer'),
      handToggle: document.getElementById('hand-toggle'),
      handChevron: document.getElementById('hand-chevron'),
      handCount: document.getElementById('hand-count'),
      contextMenu: document.getElementById('context-menu'),
      selectionBox: document.getElementById('selection-box'),
      lobbyModal: document.getElementById('lobby-modal'),
      btnCreateRoom: document.getElementById('btn-create-room'),
      btnJoinRoom: document.getElementById('btn-join-room'),
      btnOfflineMode: document.getElementById('btn-offline-mode'),
      roomDisplay: document.getElementById('room-display'),
      roomCodeTxt: document.getElementById('room-code-txt'),
      playerNameInput: document.getElementById('player-name-input'),
      roomCodeInput: document.getElementById('room-code-input'),
      selectTheme: document.getElementById('select-theme')
    };

    // Card Deck Generator
    function generateDeck() {
      const newDeck = [];
      let idCounter = 1;

      CARD_COLORS.forEach(color => {
        // Number 0 (1 per color)
        newDeck.push({ id: `c_${idCounter++}`, color, value: '0', type: 'number', faceUp: false, rotation: 0 });

        // Numbers 1-9 (2 per color)
        for (let num = 1; num <= 9; num++) {
          newDeck.push({ id: `c_${idCounter++}`, color, value: String(num), type: 'number', faceUp: false, rotation: 0 });
          newDeck.push({ id: `c_${idCounter++}`, color, value: String(num), type: 'number', faceUp: false, rotation: 0 });
        }

        // Special Cards (2 per color) - Replaces Draw 2, Reverse, Skip
        for (let s = 0; s < 2; s++) {
          newDeck.push({ id: `c_${idCounter++}`, color, value: 'SPECIAL', type: 'special', faceUp: false, rotation: 0 });
        }
      });

      // Wild & Wild Draw 4 Cards (Black)
      for (let w = 0; w < 4; w++) {
        newDeck.push({ id: `c_${idCounter++}`, color: 'black', value: 'WILD', type: 'wild', faceUp: false, rotation: 0 });
        newDeck.push({ id: `c_${idCounter++}`, color: 'black', value: 'WILD +4', type: 'wild', faceUp: false, rotation: 0 });
      }

      return shuffleArray(newDeck);
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Initialize Game State
    function initGame() {
      state.deck = generateDeck();
      state.tableCards = {};
      state.handCards = [];
      state.selectedCardIds.clear();
      renderAll();
    }

    // Render Function
    function renderAll() {
      // Update Deck Counter
      elements.deckCount.textContent = state.deck.length;

      // Render Table Cards
      const existingCardElems = new Map();
      document.querySelectorAll('.card[data-table="true"]').forEach(el => {
        existingCardElems.set(el.id, el);
      });

      Object.values(state.tableCards).forEach(card => {
        let el = existingCardElems.get(card.id);
        if (!el) {
          el = createCardElement(card, true);
          elements.tableCanvas.appendChild(el);
        } else {
          updateCardElement(el, card);
          existingCardElems.delete(card.id);
        }
      });

      // Remove Old Cards
      existingCardElems.forEach(el => el.remove());

      // Render Player Hand Cards
      elements.handContainer.innerHTML = '';
      state.handCards.forEach(card => {
        const handEl = createCardElement(card, false);
        elements.handContainer.appendChild(handEl);
      });

      elements.handCount.textContent = `(${state.handCards.length} cards)`;
    }

    function createCardElement(card, isTable) {
      const el = document.createElement('div');
      el.id = card.id;
      el.dataset.table = isTable;
      updateCardElement(el, card);

      if (isTable) {
        attachTableCardEvents(el);
      } else {
        attachHandCardEvents(el);
      }

      return el;
    }

    function updateCardElement(el, card) {
      el.className = `card color-${card.color} type-${card.type} ${card.faceUp ? 'face-up' : 'face-down'}`;
      if (state.selectedCardIds.has(card.id)) el.classList.add('selected');

      if (el.dataset.table === "true") {
        el.style.left = `${card.x}px`;
        el.style.top = `${card.y}px`;
        el.style.zIndex = card.zIndex || 1;
        el.style.transform = `rotate(${card.rotation || 0}deg)`;
      }

      el.innerHTML = `
        <div class="card-top">${card.value}</div>
        <div class="card-center">${card.value}</div>
        <div class="card-bottom">${card.value}</div>
      `;
    }

    // Event Handling - Dragging & Interactivity
    let dragData = null;

    function attachTableCardEvents(el) {
      el.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return; // Only left click
        e.stopPropagation();

        const card = state.tableCards[el.id];
        if (!card) return;

        // Bring to front
        state.highestZIndex++;
        card.zIndex = state.highestZIndex;
        el.style.zIndex = card.zIndex;

        if (!e.shiftKey && !state.selectedCardIds.has(card.id)) {
          state.selectedCardIds.clear();
        }
        state.selectedCardIds.add(card.id);

        dragData = {
          startX: e.clientX,
          startY: e.clientY,
          initialPositions: Array.from(state.selectedCardIds).map(id => ({
            id,
            x: state.tableCards[id].x,
            y: state.tableCards[id].y
          }))
        };

        el.setPointerCapture(e.pointerId);
        sfx.playCardSlide();
      });

      el.addEventListener('pointermove', (e) => {
        if (!dragData) return;
        const dx = e.clientX - dragData.startX;
        const dy = e.clientY - dragData.startY;

        dragData.initialPositions.forEach(pos => {
          const c = state.tableCards[pos.id];
          if (c) {
            c.x = Math.max(0, pos.x + dx);
            c.y = Math.max(0, pos.y + dy);
            const cardEl = document.getElementById(pos.id);
            if (cardEl) {
              cardEl.style.left = `${c.x}px`;
              cardEl.style.top = `${c.y}px`;
            }
          }
        });
      });

      el.addEventListener('pointerup', (e) => {
        if (!dragData) return;
        dragData = null;
        try { el.releasePointerCapture(e.pointerId); } catch(err){}
      });

      el.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        const card = state.tableCards[el.id];
        if (card) {
          card.faceUp = !card.faceUp;
          sfx.playCardFlip();
          renderAll();
        }
      });

      el.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        state.activeContextMenuCardId = el.id;
        showContextMenu(e.clientX, e.clientY);
      });
    }

    function attachHandCardEvents(el) {
      el.addEventListener('click', () => {
        // Play card from hand to table center
        const index = state.handCards.findIndex(c => c.id === el.id);
        if (index !== -1) {
          const card = state.handCards.splice(index, 1)[0];
          card.x = elements.tableViewport.scrollLeft + 400 + (Math.random() * 40 - 20);
          card.y = elements.tableViewport.scrollTop + 250 + (Math.random() * 40 - 20);
          card.faceUp = true;
          state.highestZIndex++;
          card.zIndex = state.highestZIndex;
          state.tableCards[card.id] = card;
          sfx.playCardSlide();
          renderAll();
        }
      });
    }

    // Context Menu Controls
    function showContextMenu(x, y) {
      elements.contextMenu.style.display = 'flex';
      elements.contextMenu.style.left = `${x}px`;
      elements.contextMenu.style.top = `${y}px`;
    }

    function hideContextMenu() {
      elements.contextMenu.style.display = 'none';
      state.activeContextMenuCardId = null;
    }

    document.addEventListener('click', hideContextMenu);

    document.getElementById('menu-flip').addEventListener('click', () => {
      if (state.activeContextMenuCardId) {
        const c = state.tableCards[state.activeContextMenuCardId];
        if (c) { c.faceUp = !c.faceUp; sfx.playCardFlip(); renderAll(); }
      }
    });

    document.getElementById('menu-rotate').addEventListener('click', () => {
      if (state.activeContextMenuCardId) {
        const c = state.tableCards[state.activeContextMenuCardId];
        if (c) { c.rotation = ((c.rotation || 0) + 90) % 360; renderAll(); }
      }
    });

    document.getElementById('menu-to-hand').addEventListener('click', () => {
      if (state.activeContextMenuCardId) {
        const c = state.tableCards[state.activeContextMenuCardId];
        if (c) {
          delete state.tableCards[c.id];
          state.handCards.push(c);
          sfx.playCardSlide();
          renderAll();
        }
      }
    });

    document.getElementById('menu-to-deck').addEventListener('click', () => {
      if (state.activeContextMenuCardId) {
        const c = state.tableCards[state.activeContextMenuCardId];
        if (c) {
          delete state.tableCards[c.id];
          c.faceUp = false;
          state.deck.unshift(c);
          sfx.playCardSlide();
          renderAll();
        }
      }
    });

    // Draw Mechanics
    function drawCardToTable() {
      if (state.deck.length === 0) return;
      const card = state.deck.pop();
      card.x = 180 + (Math.random() * 30 - 15);
      card.y = 60 + (Math.random() * 30 - 15);
      card.faceUp = true;
      state.highestZIndex++;
      card.zIndex = state.highestZIndex;
      state.tableCards[card.id] = card;
      sfx.playCardSlide();
      renderAll();
    }

    function drawCardsToHand(count) {
      for (let i = 0; i < count; i++) {
        if (state.deck.length > 0) {
          const card = state.deck.pop();
          card.faceUp = true;
          state.handCards.push(card);
        }
      }
      sfx.playCardSlide();
      renderAll();
    }

    elements.deckZone.addEventListener('click', drawCardToTable);
    document.getElementById('btn-draw-1').addEventListener('click', () => drawCardsToHand(1));
    document.getElementById('btn-draw-2').addEventListener('click', () => drawCardsToHand(2));
    document.getElementById('btn-draw-7').addEventListener('click', () => drawCardsToHand(7));

    // Global Toolbar Buttons
    document.getElementById('btn-flip-all').addEventListener('click', () => {
      Object.values(state.tableCards).forEach(c => c.faceUp = !c.faceUp);
      sfx.playCardFlip();
      renderAll();
    });

    document.getElementById('btn-tidy').addEventListener('click', () => {
      const cards = Object.values(state.tableCards);
      cards.forEach((c, index) => {
        c.x = 350 + (index % 8) * 85;
        c.y = 120 + Math.floor(index / 8) * 115;
        c.rotation = 0;
      });
      renderAll();
    });

    document.getElementById('btn-shuffle').addEventListener('click', () => {
      state.deck = shuffleArray(state.deck);
      sfx.playCardSlide();
      renderAll();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (confirm("Reset the entire game table?")) {
        initGame();
      }
    });

    // Theme Switcher
    elements.selectTheme.addEventListener('change', (e) => {
      const theme = e.target.value;
      if (theme === 'felt') {
        document.documentElement.style.setProperty('--felt-color', '#123826');
      } else if (theme === 'blue') {
        document.documentElement.style.setProperty('--felt-color', '#1a2a3a');
      } else if (theme === 'wood') {
        document.documentElement.style.setProperty('--felt-color', '#2c1810');
      } else if (theme === 'slate') {
        document.documentElement.style.setProperty('--felt-color', '#1e293b');
      }
    });

    // Hand Drawer Expand/Collapse
    elements.handToggle.addEventListener('click', () => {
      elements.handDrawer.classList.toggle('collapsed');
      elements.handChevron.textContent = elements.handDrawer.classList.contains('collapsed') ? '▲' : '▼';
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        state.selectedCardIds.forEach(id => {
          if (state.tableCards[id]) state.tableCards[id].faceUp = !state.tableCards[id].faceUp;
        });
        sfx.playCardFlip();
        renderAll();
      } else if (e.key === 'r' || e.key === 'R') {
        state.selectedCardIds.forEach(id => {
          if (state.tableCards[id]) {
            state.tableCards[id].rotation = ((state.tableCards[id].rotation || 0) + 90) % 360;
          }
        });
        renderAll();
      }
    });

    // Lobby / Multi-Player Setup Functions
    function enterGame(roomCode) {
      state.roomId = roomCode;
      state.playerName = elements.playerNameInput.value.trim() || 'Player 1';
      elements.lobbyModal.style.display = 'none';
      elements.roomDisplay.style.display = 'flex';
      elements.roomCodeTxt.textContent = roomCode;
      initGame();
    }

    elements.btnCreateRoom.addEventListener('click', () => {
      const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
      enterGame(randomCode);
    });

    elements.btnJoinRoom.addEventListener('click', () => {
      const code = elements.roomCodeInput.value.trim().toUpperCase();
      if (code.length === 6) {
        enterGame(code);
      } else {
        alert("Please enter a valid 6-digit room code.");
      }
    });

    elements.btnOfflineMode.addEventListener('click', () => {
      enterGame("LOCAL");
    });

    // Start in default ready state
    initGame();
  </script>
</body>
</html>
